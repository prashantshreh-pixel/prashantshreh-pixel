<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%">
  <defs>
    <!-- Midnight Sky Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Shooting Star Gradient -->
    <linearGradient id="shooting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Star Twinkle Animation */
    .star { animation: pulse 2.5s infinite ease-in-out alternate; }
    .s1 { animation-delay: 0s; }
    .s2 { animation-delay: 0.7s; }
    .s3 { animation-delay: 1.4s; }

    @keyframes pulse {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.3); }
    }

    /* Falling / Shooting Stars Animation */
    .shooting-star-1 {
      stroke: url(#shooting);
      stroke-width: 2;
      stroke-linecap: round;
      animation: shoot1 4s infinite linear;
    }
    .shooting-star-2 {
      stroke: url(#shooting);
      stroke-width: 1.5;
      stroke-linecap: round;
      animation: shoot2 6s infinite linear 2s;
    }

    @keyframes shoot1 {
      0% { transform: translate(500px, -60px); opacity: 1; }
      25% { transform: translate(100px, 180px); opacity: 0; }
      100% { transform: translate(100px, 180px); opacity: 0; }
    }

    @keyframes shoot2 {
      0% { transform: translate(700px, -60px); opacity: 1; }
      30% { transform: translate(250px, 200px); opacity: 0; }
      100% { transform: translate(250px, 200px); opacity: 0; }
    }

    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      text-anchor: middle;
      filter: drop-shadow(0px 0px 10px rgba(56, 189, 248, 0.7));
    }

    .subtitle {
      font-family: 'Fira Code', Consolas, monospace;
      font-weight: 500;
      font-size: 17px;
      fill: #38bdf8;
      text-anchor: middle;
    }
  </style>

  <!-- Background -->
  <rect width="800" height="220" rx="12" fill="url(#bg)" />

  <!-- Moon with Glow -->
  <g transform="translate(710, 50)">
    <circle cx="0" cy="0" r="22" fill="#f3f4f6" opacity="0.95" filter="url(#glow)"/>
    <circle cx="7" cy="-5" r="19" fill="#111827"/>
  </g>

  <!-- Twinkling Stars -->
  <circle cx="60" cy="40" r="1.5" fill="#fff" class="star s1" />
  <circle cx="130" cy="80" r="2" fill="#38bdf8" class="star s2" />
  <circle cx="210" cy="35" r="1" fill="#fff" class="star s3" />
  <circle cx="290" cy="90" r="2.5" fill="#e0e7ff" class="star s1" />
  <circle cx="370" cy="45" r="1.5" fill="#fff" class="star s2" />
  <circle cx="460" cy="75" r="2" fill="#38bdf8" class="star s3" />
  <circle cx="540" cy="35" r="1" fill="#fff" class="star s1" />
  <circle cx="630" cy="85" r="2" fill="#e0e7ff" class="star s2" />
  <circle cx="110" cy="160" r="1" fill="#fff" class="star s3" />
  <circle cx="190" cy="175" r="2" fill="#38bdf8" class="star s1" />
  <circle cx="660" cy="165" r="1.5" fill="#fff" class="star s2" />
  <circle cx="740" cy="145" r="2" fill="#38bdf8" class="star s3" />

  <!-- Falling / Shooting Stars -->
  <line x1="0" y1="0" x2="-90" y2="55" class="shooting-star-1" />
  <line x1="0" y1="0" x2="-80" y2="50" class="shooting-star-2" />

  <!-- Centered Name & Subtitle -->
  <text x="400" y="110" class="title">Prashant Shrestha</text>
  <text x="400" y="152" class="subtitle">&gt; Software Developer | C# &amp; DevOps Engineer</text>
</svg>
